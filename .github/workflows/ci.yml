name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validation (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: libomp pour clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Compilateur et palier SIMD
        run: |
          ${{ matrix.cc }} --version | head -1
          make CC=${{ matrix.cc }} simd

      - name: Compilation
        run: make CC=${{ matrix.cc }}

      - name: make check
        run: make CC=${{ matrix.cc }} check

  sanitize:
    name: ASan + UBSan (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: libomp pour clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: make sanitize
        run: make CC=${{ matrix.cc }} sanitize

  warnings:
    name: Zero avertissement (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: libomp pour clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      # Les trois variantes que MESURES.md annonce sans avertissement.
      # -Werror transforme la promesse en test.
      - name: -Werror, avec OpenMP
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -g -Wall -Wextra -Werror"

      - name: -Werror, sans OpenMP
        run: |
          make clean
          make CC=${{ matrix.cc }} OPENMP= CFLAGS="-O2 -g -Wall -Wextra -Werror"

      - name: -Werror, RECOMPUTE_TURN=1
        run: |
          ${{ matrix.cc }} -O2 -Wall -Wextra -Werror -march=native -fopenmp \
            -DRECOMPUTE_TURN=1 -c -o /dev/null main12.c
